<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Takipİlaç | Akıllı Sağlık Asistanı</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Inter', sans-serif; }
        .app-card { 
            background: linear-gradient(145deg, #1e293b, #0f172a); 
            border: 2px solid #334155; 
            border-radius: 2.5rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        .time-panel { display: none; animation: slideIn 0.4s ease-out; }
        .time-panel.active { display: block; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .nav-btn { color: #64748b; transition: 0.3s; }
        .nav-btn.active { color: #3b82f6; }
    </style>
</head>
<body class="flex flex-col min-h-screen bg-slate-950 p-4 pb-24">

    <div class="flex justify-end mb-6">
        <button class="text-[10px] font-black bg-blue-600/20 text-blue-400 border border-blue-500/30 px-5 py-2 rounded-full uppercase tracking-tighter shadow-lg shadow-blue-900/20">
            GİRİŞ YAP / ÜYE OL
        </button>
    </div>

    <main class="w-full max-w-md mx-auto app-card p-8 text-center">
        <div class="mb-10">
            <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-300">Takipİlaç</h1>
            <p class="text-[10px] text-slate-500 font-bold uppercase tracking-[0.3em] mt-2">Dürüst Sağlık Rehberiniz</p>
        </div>

        <div class="grid grid-cols-2 gap-6 mb-10">
            <button onclick="toggleType('aç')" class="bg-emerald-500/5 border-2 border-emerald-500/30 p-8 rounded-[2rem] hover:bg-emerald-500/10 transition-all group">
                <i class="fas fa-apple-whole text-4xl text-emerald-500 mb-3 group-hover:scale-110 transition-transform"></i>
                <span class="block text-[11px] font-black uppercase">AÇ KARNINA</span>
            </button>
            <button onclick="toggleType('tok')" class="bg-orange-500/5 border-2 border-orange-500/30 p-8 rounded-[2rem] hover:bg-orange-500/10 transition-all group">
                <i class="fas fa-utensils text-4xl text-orange-500 mb-3 group-hover:scale-110 transition-transform"></i>
                <span class="block text-[11px] font-black uppercase">TOK KARNINA</span>
            </button>
        </div>

        <div id="timeSelector" class="time-panel space-y-4 mb-10">
            <p id="timeHeader" class="text-[10px] font-bold text-blue-400 uppercase tracking-widest"></p>
            <div class="grid grid-cols-2 gap-3">
                <button class="bg-slate-800 p-4 rounded-2xl border border-slate-700 hover:border-blue-400 text-left">
                    <span class="text-xs font-bold block mb-1"><i class="fas fa-sun mr-2 text-yellow-500"></i>Sabah</span>
                    <span class="text-[10px] text-slate-500 font-medium">08:00 - 09:00</span>
                </button>
                <button class="bg-slate-800 p-4 rounded-2xl border border-slate-700 hover:border-blue-400 text-left">
                    <span class="text-xs font-bold block mb-1"><i class="fas fa-cloud-sun mr-2 text-orange-400"></i>Öğle</span>
                    <span class="text-[10px] text-slate-500 font-medium">12:30 - 13:30</span>
                </button>
                <button class="bg-slate-800 p-4 rounded-2xl border border-slate-700 hover:border-blue-400 text-left">
                    <span class="text-xs font-bold block mb-1"><i class="fas fa-cloud-moon mr-2 text-blue-400"></i>Akşam</span>
                    <span class="text-[10px] text-slate-500 font-medium">19:00 - 20:30</span>
                </button>
                <button class="bg-slate-800 p-4 rounded-2xl border border-slate-700 hover:border-blue-400 text-left">
                    <span class="text-xs font-bold block mb-1"><i class="fas fa-moon mr-2 text-purple-500"></i>Gece</span>
                    <span class="text-[10px] text-slate-500 font-medium">23:00 - 00:00</span>
                </button>
            </div>
        </div>

        <div class="space-y-4">
            <input type="text" placeholder="İlaç veya krem adını yazın..." class="w-full bg-slate-800/50 border-2 border-slate-700 p-5 rounded-3xl outline-none focus:border-blue-500 transition-all text-sm">
            <button class="w-full bg-blue-600 p-5 rounded-3xl font-black text-xs uppercase tracking-widest shadow-xl shadow-blue-600/30 active:scale-95 transition-all">
                ASİSTANI AKTİFLEŞTİR
            </button>
        </div>
    </main>

    <footer class="fixed bottom-0 left-0 right-0 bg-slate-900/80 backdrop-blur-xl border-t border-slate-800 p-6 flex justify-around items-center">
        <button class="nav-btn active"><i class="fas fa-house text-2xl"></i></button>
        <button class="nav-btn" onclick="alert('Takvim Çok Yakında!')"><i class="fas fa-calendar-days text-2xl"></i></button>
        <button class="nav-btn" onclick="alert('İlaç Dolabınız Hazırlanıyor!')"><i class="fas fa-box-archive text-2xl"></i></button>
        <button class="nav-btn" onclick="alert('Doktor Paneli Çok Yakında!')"><i class="fas fa-notes-medical text-2xl"></i></button>
    </footer>

    <script>
        function toggleType(type) {
            const panel = document.getElementById('timeSelector');
            const header = document.getElementById('timeHeader');
            panel.classList.add('active');
            header.innerText = type + " KARNINA İÇİLECEK ZAMANI SEÇİN";
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }
    </script>
</body>
</html>
